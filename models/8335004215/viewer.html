in vec3 position;in vec3 normal;uniform mat4 vp;uniform vec3 offset;out vec3 n;void main(){n=normal;gl_Position=vp*vec4(position+offset,1.);}`));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;in vec3 n;uniform vec3 color;out vec4 frag;void main(){vec3 nn=normalize(n);if(!gl_FrontFacing)nn=-nn;float light=.42+.48*max(dot(nn,normalize(vec3(-.4,-.5,1.))),0.)+.10*max(dot(nn,normalize(vec3(.7,.2,.4))),0.);frag=vec4(color*light,1.);}`));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const pos=gl.getAttribLocation(program,'position'),norm=gl.getAttribLocation(program,'normal'),vp=gl.getUniformLocation(program,'vp'),offset=gl.getUniformLocation(program,'offset'),color=gl.getUniformLocation(program,'color');
const visible={}, buffers=data.parts.map(p=>{visible[p.category]=true;const vao=gl.createVertexArray();gl.bindVertexArray(vao);for(const [location,array]of[[pos,p.vertices],[norm,p.normals]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(array),gl.STATIC_DRAW);gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,3,gl.FLOAT,false,0,0);}const b=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(p.indices),gl.STATIC_DRAW);return{...p,vao,count:p.indices.length};});
const categories=Object.keys(labels).filter(k=>k in visible),groupContainer=document.getElementById('groups');
for(const k of categories){const l=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.onchange=()=>{visible[k]=cb.checked;draw();};l.append(cb,document.createTextNode(' '+labels[k]));groupContainer.append(l);}
const choices=document.getElementById('parts');choices.add(new Option('選択なし（全体）','-1'));buffers.forEach((p,i)=>choices.add(new Option(p.name,i)));choices.onchange=()=>{const p=buffers[+choices.value];document.getElementById('detail').textContent=p?`${p.name}\n${p.evidence}\n${p.assumption}`:'';draw();};
for(const a of data.assumptions){let p=document.createElement('p');p.textContent=`${a.field}: ${JSON.stringify(a.value)} — ${a.reason}`;document.getElementById('assumptions').append(p);}
const lo=data.bounds[0],hi=data.bounds[1],center=lo.map((v,i)=>(v+hi[i])/2),radius=Math.hypot(...lo.map((v,i)=>(hi[i]-v)/2));
let target=center.slice(),yaw=-1.05,pitch=.43,distance=radius*2.7,exploded=false;
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>a.map(v=>v/Math.hypot(...a));
function multiply(a,b){let c=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)c[j*4+i]+=a[k*4+i]*b[j*4+k];return c;}
function draw(){const dpr=Math.min(devicePixelRatio,2),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clearColor(.047,.083,.129,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
const eye=target.map((v,i)=>v+distance*[Math.cos(pitch)*Math.cos(yaw),Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch)][i]);const z=unit(sub(eye,target)),x=unit(cross([0,0,1],z)),y=cross(z,x);const view=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);const near=Math.max(radius*.001,distance-radius*1.5),far=distance+radius*5,f=1/Math.tan(.55/2);const proj=new Float32Array([f/(w/h),0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);gl.uniformMatrix4fv(vp,false,multiply(proj,view));
const ex={foundations:-3,supports:0,bearings:1,girders:2,bracing:2,deck:3,curbs:4,pavement:4,railings:5,markings:4};for(const [i,p]of buffers.entries()){if(!visible[p.category])continue;gl.bindVertexArray(p.vao);gl.uniform3fv(offset,[0,0,exploded?(ex[p.category]||0)*Math.max(1,(hi[2]-lo[2])*.22):0]);gl.uniform3fv(color,+choices.value===i?[1,.72,.22]:p.color);gl.drawElements(gl.TRIANGLES,p.count,gl.UNSIGNED_INT,0);}}
function reset(mode){target=center.slice();distance=radius*3.5;[yaw,pitch]=mode==='top'?[-Math.PI/2,Math.PI/2-.001]:mode==='side'?[-Math.PI/2,.001]:mode==='end'?[0,.001]:[-1.05,.43];draw();}
let drag=null;canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===2};};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.pan){const scale=distance/canvas.clientHeight*.45;target[0]+=Math.sin(yaw)*dx*scale;target[1]-=Math.cos(yaw)*dx*scale;target[2]+=dy*scale;}else{yaw-=dx*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.008));}draw();};canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(radius*.04,Math.min(radius*30,distance*Math.exp(e.deltaY*.001)));draw();},{passive:false});
function capture(){draw();const a=document.createElement('a');a.download=data.id+'_view.png';a.href=canvas.toDataURL('image/png');a.click();}
new ResizeObserver(draw).observe(canvas);draw();
</script></body></html>
